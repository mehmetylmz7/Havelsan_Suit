<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katılımcı Bilgisi - ASR Kullanıcı Testi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/asr.css') }}">
</head>
<body>

    <!-- Header -->
    <header class="py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0 fw-bold">ASR Kullanıcı Testi</h1>
            <span class="badge bg-light text-dark fs-6">Aşama 2: Katılımcı Bilgisi</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card card-academic p-4 p-md-5">
                    <div class="card-header-academic pb-3 mb-4 fs-4 d-flex justify-content-between align-items-center">
                        <span>Katılımcı Bilgi Formu</span>
                        <span class="text-secondary fs-6 fw-normal">Kimliğiniz: <strong class="text-dark">{{ participant_id }}</strong></span>
                    </div>
                    
                    <div class="card-body">
                        <form action="{{ url_for('demographics') }}" method="POST" id="demoForm" class="needs-validation" novalidate>
                            
                            <!-- Participant ID (Hidden or Read-Only) -->
                            <div class="mb-4">
                                <label class="form-label form-label-lg">Katılımcı Kodu (Otomatik Atandı)</label>
                                <input type="text" class="form-control form-control-lg bg-light text-muted fw-bold" value="{{ participant_id }}" readonly>
                            </div>

                            <!-- Age -->
                            <div class="mb-4">
                                <label for="age" class="form-label form-label-lg">Yaş</label>
                                <input type="number" class="form-control form-control-lg" name="age" id="age" min="1" max="120" placeholder="Örn: 25" required>
                                <div class="invalid-feedback">Lütfen geçerli bir yaş giriniz.</div>
                            </div>

                            <!-- Gender -->
                            <div class="mb-4">
                                <label for="gender" class="form-label form-label-lg">Cinsiyet</label>
                                <select class="form-select form-select-lg" name="gender" id="gender" required>
                                    <option value="" selected disabled>Seçiniz</option>
                                    <option value="Erkek">Erkek</option>
                                    <option value="Kadın">Kadın</option>
                                    <option value="Belirtmek İstemiyorum">Belirtmek İstemiyorum</option>
                                </select>
                                <div class="invalid-feedback">Lütfen cinsiyet seçiniz.</div>
                            </div>

                            <!-- Education -->
                            <div class="mb-4">
                                <label for="education" class="form-label form-label-lg">Eğitim Düzeyi</label>
                                <select class="form-select form-select-lg" name="education" id="education" required>
                                    <option value="" selected disabled>Seçiniz</option>
                                    <option value="İlkokul/Ortaokul">İlkokul/Ortaokul</option>
                                    <option value="Lise">Lise</option>
                                    <option value="Ön Lisans">Ön Lisans</option>
                                    <option value="Lisans">Lisans</option>
                                    <option value="Yüksek Lisans">Yüksek Lisans</option>
                                    <option value="Doktora">Doktora</option>
                                </select>
                                <div class="invalid-feedback">Lütfen eğitim düzeyini seçiniz.</div>
                            </div>

                            <!-- English Level -->
                            <div class="mb-4">
                                <label for="english_level" class="form-label form-label-lg">İngilizce Seviyesi</label>
                                <select class="form-select form-select-lg" name="english_level" id="english_level" required>
                                    <option value="" selected disabled>Seçiniz</option>
                                    <option value="A1">A1 (Başlangıç)</option>
                                    <option value="A2">A2 (Temel)</option>
                                    <option value="B1">B1 (Orta Altı)</option>
                                    <option value="B2">B2 (Orta)</option>
                                    <option value="C1">C1 (İleri)</option>
                                    <option value="C2">C2 (Yetkin)</option>
                                </select>
                                <div class="invalid-feedback">Lütfen İngilizce seviyenizi seçiniz.</div>
                            </div>

                            <!-- Form Navigation Buttons -->
                            <div class="row mt-5">
                                <div class="col-6 d-grid">
                                    <a href="{{ url_for('consent') }}" class="btn btn-pi btn-pi-secondary btn-lg">Geri Dön</a>
                                </div>
                                <div class="col-6 d-grid">
                                    <button type="submit" class="btn btn-pi btn-pi-primary btn-lg">
                                        Kaydet ve Teste Başla
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-mic-fill ms-2" viewBox="0 0 16 16">
                                            <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"/>
                                            <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <span>© 2026 Havelsan Suit ASR Değerlendirme Modülü</span>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Validation JS -->
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
